<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ENISHI | 3D Custom Glove</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<header><b>ENISHI</b><span>3D CUSTOM GLOVE</span></header>
<main>
  <aside>
    <h2>カラー</h2>
    <label>本体 <input id="bodyColor" type="color" value="#c98a43"></label>
    <label>レース <input id="laceColor" type="color" value="#5b2d18"></label>
    <label>ステッチ <input id="stitchColor" type="color" value="#d9a514"></label>
    <h2>刺繍</h2>
    <input id="embroidery" maxlength="24" value="R. Takumi">
    <p class="note">※ 3Dモデル内のメッシュ名に body / lace / stitch が含まれていると、各色が個別反映されます。</p>
  </aside>
  <section class="viewer">
    <div id="loading">3Dグローブを読み込み中…</div>
    <div id="error" hidden>
      <b>glove.glb がまだありません</b><br>
      custom フォルダに <code>glove.glb</code> を追加してください。
    </div>
    <canvas id="gloveCanvas"></canvas>
    <div class="hint">ドラッグで回転 ／ ホイールでズーム</div>
  </section>
  <aside class="summary">
    <h2>カスタム内容</h2>
    <div>刺繍 <strong id="embroideryOut">R. Takumi</strong></div>
    <div class="price">¥55,000 <small>税込</small></div>
  </aside>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
