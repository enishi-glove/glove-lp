<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CROWN | カラーシミュレーター</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#191612;font:14px Arial,'Yu Gothic',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:64px;background:#fffdf9;border-bottom:1px solid #e8dfd4;display:flex;align-items:center;justify-content:space-between;padding:0 22px}header b{font: bold 27px Georgia;letter-spacing:5px}header small{letter-spacing:2px;color:#766d63}main{display:grid;grid-template-columns:270px minmax(0,1fr) 260px;min-height:calc(100vh - 64px)}aside{background:#fffdf9;padding:22px 17px}aside:first-child{border-right:1px solid #e8dfd4}aside:last-child{border-left:1px solid #e8dfd4}.section{border-bottom:1px solid #e8dfd4;padding-bottom:22px;margin-bottom:22px}.title{font-weight:bold;margin-bottom:16px}.num{display:inline-grid;place-items:center;width:21px;height:21px;background:#191612;color:white;border-radius:50%;font-size:11px;margin-right:8px}.models,.faces{display:flex;gap:7px}.models button,.faces button,.tools button,.upload{border:1px solid #e8dfd4;background:white;border-radius:8px;padding:10px;font-size:12px}.models button{flex:1}.active{outline:2px solid #191612!important}.row{margin:16px 0}.label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}.label span:last-child{color:#766d63}.swatches{display:flex;gap:9px;flex-wrap:wrap}.swatches button{width:26px;height:26px;border:2px solid #fff;border-radius:50%;outline:1px solid #cfc6bb}.swatches button.active{outline:2px solid #191612!important}input[type=text],select{width:100%;padding:11px;border:1px solid #e8dfd4;background:white;border-radius:8px}.stage{padding:18px 20px}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.tools{display:flex;gap:7px}.viewer{height:min(65vh,690px);min-height:430px;background:#f1ece5;border:1px solid #e8dfd4;border-radius:17px;display:grid;place-items:center;overflow:hidden;position:relative}.photo{max-width:90%;max-height:88%;object-fit:contain;filter:drop-shadow(0 16px 18px #66554433);transform:scale(var(--zoom,1));transition:transform .2s}.empty{text-align:center;color:#766d63;max-width:330px;line-height:1.8;padding:25px}.empty strong{display:block;color:#191612;font-size:17px}.empty label{display:inline-block;margin-top:14px}.upload{display:inline-block;cursor:pointer}.upload input{display:none}.below{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:#766d63;font-size:12px}.sample{margin-top:18px;padding:15px;background:#fffdf9;border:1px solid #e8dfd4;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:15px}.leather{background:#c98a43;border-radius:8px;min-height:80px;display:grid;place-items:center;font:24px cursive;color:#281b15}.summary{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e8dfd4;font-size:12px}.summary span:last-child{font-weight:bold}.price{display:flex;justify-content:space-between;align-items:end;margin:24px 0}.price strong{font-size:23px}.action{width:100%;padding:13px;border-radius:8px;background:#191612;color:white;border:0}.note{font-size:11px;line-height:1.7;color:#766d63;margin-top:15px}h3{margin:0 0 5px}p{margin:0;color:#766d63;font-size:12px}@media(max-width:1050px){main{grid-template-columns:240px 1fr}aside:last-child{grid-column:1/-1;border-left:0;border-top:1px solid #e8dfd4}}@media(max-width:700px){main{display:block}.stage{padding:12px}.viewer{height:52vh;min-height:340px}.sample{grid-template-columns:1fr}header small{display:none}}
</style></head><body><header><div><b>CROWN</b> <small>CUSTOM GLOVE</small></div><span>カラーシミュレーション</span></header><main><aside><div class="section"><div class="title"><span class="num">1</span>モデルを選ぶ</div><div class="models"><button class="active">内野手用</button><button>外野手用</button><button>投手用</button></div></div><div class="section"><div class="title"><span class="num">2</span>カラーを選ぶ</div><div id="colors"></div></div><div class="section"><div class="title"><span class="num">3</span>刺繍・文字入れ</div><p>入力する文字</p><input id="embroidery" type="text" maxlength="24" value="R. Takumi"><p style="margin:14px 0 6px">書体</p><select id="font"><option>筆記体</option><option>ゴシック体</option><option>明朝体</option></select></div></aside><section class="stage"><div class="bar"><div class="faces"><button data-face="front" class="active">表面</button><button data-face="back">裏面</button></div><div class="tools"><button id="minus">−</button><button id="plus">＋</button><button id="reset">表示リセット</button></div></div><div class="viewer"><img id="photo" class="photo" alt="選択したグローブの写真" hidden><div id="empty" class="empty"><strong>表面の画像を追加</strong>グローブ単体の写真、または透過PNGを選んでください。<br><label class="upload">画像を選択<input id="initialFile" type="file" accept="image/*"></label></div></div><div class="below"><span id="faceHint">表面を表示中</span><label class="upload">この面の画像を変更<input id="replaceFile" type="file" accept="image/*"></label></div><div class="sample"><div><h3>刺繍・文字入れプレビュー</h3><p>入力内容と革色の組み合わせを確認できます。</p></div><div class="leather" id="leather"><span id="textPreview">R. Takumi</span></div></div></section><aside><h3>カスタム内容</h3><div class="summary"><span>モデル</span><span id="modelOut">内野手用</span></div><div id="summary"></div><div class="summary"><span>刺繍</span><span id="textOut">R. Takumi</span></div><div class="price"><span>価格</span><strong>¥55,000 <small>税込</small></strong></div><button id="save" class="action">このデザインを保存</button><p class="note">画像はこのブラウザ内で表示します。表裏の画像は別々に指定できます。色の選択はカスタム内容と革サンプルに反映します。写真内の本体・紐・縫い目を正確に塗り分けるには、各面の領域マスクが必要です。</p></aside></main><script>
const options={body:[['キャメル','#c98a43'],['オレンジ','#dc6d1c'],['レッド','#bd3b2f'],['ネイビー','#234f7f'],['ブラック','#171717'],['ホワイト','#f2efe9']],lace:[['ブラウン','#6f321b'],['ブラック','#141414'],['レッド','#ad243c'],['ネイビー','#294d7e'],['ホワイト','#efede6']],stitch:[['ゴールド','#d8a51a'],['ホワイト','#f2efe9'],['ブラウン','#8d321c'],['ブラック','#171717']]};const labels={body:'本体カラー',lace:'レース',stitch:'ステッチ'};const state={model:'内野手用',face:'front',zoom:1,colors:{body:0,lace:0,stitch:0},images:{front:null,back:null}};const $=id=>document.getElementById(id);const colorRoot=$('colors'),summary=$('summary');Object.entries(options).forEach(([key,values])=>{let row=document.createElement('div');row.className='row';row.innerHTML=`<div class="label"><span>${labels[key]}</span><span id="${key}Name"></span></div><div class="swatches"></div>`;let sw=row.querySelector('.swatches');values.forEach(([name,hex],idx)=>{let b=document.createElement('button');b.type='button';b.title=name;b.setAttribute('aria-label',`${labels[key]} ${name}`);b.style.background=hex;b.onclick=()=>{state.colors[key]=idx;render()};sw.append(b)});colorRoot.append(row);let s=document.createElement('div');s.className='summary';s.innerHTML=`<span>${labels[key]}</span><span id="${key}Out"></span>`;summary.append(s)});
function render(){for(let key of Object.keys(options)){let [name,hex]=options[key][state.colors[key]];$(key+'Name').textContent=name;$(key+'Out').textContent=name;colorRoot.querySelectorAll('.row')[Object.keys(options).indexOf(key)].querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===state.colors[key]));if(key==='body')$('leather').style.background=hex}document.querySelectorAll('.faces button').forEach(b=>b.classList.toggle('active',b.dataset.face===state.face));let src=state.images[state.face],img=$('photo');img.hidden=!src;if(src)img.src=src;else img.removeAttribute('src');$('empty').hidden=!!src;$('empty').querySelector('strong').textContent=(state.face==='front'?'表面':'裏面')+'の画像を追加';$('faceHint').textContent=(state.face==='front'?'表面':'裏面')+'を表示中';img.style.setProperty('--zoom',state.zoom)}
document.querySelectorAll('.faces button').forEach(b=>b.onclick=()=>{state.face=b.dataset.face;state.zoom=1;render()});document.querySelectorAll('.models button').forEach(b=>b.onclick=()=>{state.model=b.textContent;document.querySelectorAll('.models button').forEach(x=>x.classList.toggle('active',x===b));$('modelOut').textContent=state.model});function selectImage(e){let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('画像ファイルを選択してください');return}let reader=new FileReader();reader.onload=()=>{state.images[state.face]=reader.result;render()};reader.readAsDataURL(file);e.target.value=''}$('initialFile').onchange=selectImage;$('replaceFile').onchange=selectImage;$('plus').onclick=()=>{state.zoom=Math.min(2.5,state.zoom+.15);render()};$('minus').onclick=()=>{state.zoom=Math.max(.5,state.zoom-.15);render()};$('reset').onclick=()=>{state.zoom=1;render()};$('embroidery').oninput=()=>{$('textPreview').textContent=$('embroidery').value;$('textOut').textContent=$('embroidery').value||'—'};$('font').onchange=()=>{$('textPreview').style.fontFamily=$('font').value==='筆記体'?'cursive':$('font').value==='明朝体'?'serif':'sans-serif'};$('save').onclick=()=>{let data={model:state.model,colors:Object.fromEntries(Object.entries(state.colors).map(([k,i])=>[k,options[k][i][0]])),embroidery:$('embroidery').value,font:$('font').value};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='crown-design.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></body></html>
